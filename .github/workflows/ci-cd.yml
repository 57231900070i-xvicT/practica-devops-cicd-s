name: CI-CD DevOps

on:
  push:
    branches:
      - master

jobs:

  test:
    name: Pruebas de la aplicación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar archivo HTML
        run: |
          test -f index.html

      - name: Verificar contenido
        run: |
          grep "Aplicación DevOps" index.html


  build:
    name: Construir imagen Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: |
          docker build -t practica-devops .


  deploy:
    name: Desplegar aplicación
    needs: build
    runs-on: self-hosted

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Desplegar con Docker Compose
        shell: powershell
        run: |
          docker compose down
          docker compose up -d --build